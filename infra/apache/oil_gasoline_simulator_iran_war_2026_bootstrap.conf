<VirtualHost *:80>
    ServerName oil-gasoline-simulator-iran-war-2026.tglauner.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 75

    ProxyPass /api http://127.0.0.1:8000/api retry=0 timeout=75 connectiontimeout=5
    ProxyPassReverse /api http://127.0.0.1:8000/api
    ProxyPass /health http://127.0.0.1:8000/health retry=0 timeout=75 connectiontimeout=5
    ProxyPassReverse /health http://127.0.0.1:8000/health

    DocumentRoot /var/www/oil_gasoline_simulator_iran_war_2026/frontend/dist
    <Directory /var/www/oil_gasoline_simulator_iran_war_2026/frontend/dist>
        Require all granted
        Options FollowSymLinks
        AllowOverride None
        FallbackResource /index.html
    </Directory>

    <Files "index.html">
        Header set Cache-Control "no-store"
    </Files>

    <FilesMatch "\.(css|js|svg|png|jpg|jpeg|gif|webp|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    ErrorLog ${APACHE_LOG_DIR}/oil_gasoline_simulator_iran_war_2026_error.log
    CustomLog ${APACHE_LOG_DIR}/oil_gasoline_simulator_iran_war_2026_access.log combined
</VirtualHost>
