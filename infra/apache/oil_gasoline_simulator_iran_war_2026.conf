<VirtualHost *:443>
    ServerName oil-gasoline-simulator-iran-war-2026.tglauner.com
    ServerAdmin glaunertim@gmail.com

    DocumentRoot /var/www/html/oil_gasoline_simulator_iran_war_2026/frontend/dist
    <Directory "/var/www/html/oil_gasoline_simulator_iran_war_2026/frontend/dist">
        AllowOverride All
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ /index.html [L]
        FallbackResource index.html
    </Directory>

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/oil-gasoline-simulator-iran-war-2026.tglauner.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/oil-gasoline-simulator-iran-war-2026.tglauner.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 75

    ProxyPass /api/ http://127.0.0.1:8003/api/ retry=0 timeout=75 connectiontimeout=5
    ProxyPassReverse /api/ http://127.0.0.1:8003/api/
    ProxyPass /health http://127.0.0.1:8003/health retry=0 timeout=75 connectiontimeout=5
    ProxyPassReverse /health http://127.0.0.1:8003/health

    <Files "index.html">
        Header set Cache-Control "no-store"
    </Files>

    <FilesMatch "\.(css|js|svg|png|jpg|jpeg|gif|webp|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog ${APACHE_LOG_DIR}/oil_gasoline_simulator_iran_war_2026_error.log
    CustomLog ${APACHE_LOG_DIR}/oil_gasoline_simulator_iran_war_2026_access.log combined
</VirtualHost>
